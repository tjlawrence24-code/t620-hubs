# Any wired port (enp1s0, eno1, eth0...), DHCP. optional = never block boot if unplugged.
network:
  version: 2
  ethernets:
    wired:
      match: {name: "en*"}
      dhcp4: true
      dhcp6: true
      optional: true
    wired-eth:
      match: {name: "eth*"}
      dhcp4: true
      optional: true
